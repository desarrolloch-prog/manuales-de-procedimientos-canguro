services:
  - type: web
    name: canguro-manuales-procesos
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
